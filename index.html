<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>TH3 CHAIN | The Future of Proof-of-Work</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cursor-glow"></div>
    <canvas id="grid"></canvas>

    <nav>
        <div class="brand">TH3<span>CHAIN</span></div>
        <div class="nav-links">
            <a href="#">Explorer</a>
            <a href="#">Whitepaper</a>
            <button class="btn-primary" id="connect">CONNECT WALLET</button>
        </div>
    </nav>

    <main>
        <header class="hero">
            <div class="tag">DECENTRALIZED CIVILIZATION</div>
            <h1>THE FUTURE IS <span>TH3</span></h1>
            <p>Najszybsza sieć Proof-of-Work nowej generacji. W pełni zdecentralizowana, odporna na cenzurę, gotowa na masową adopcję.</p>
            <div class="hero-btns">
                <button class="btn-main">START MINING</button>
                <button class="btn-sec">BUY TH3</button>
            </div>
        </header>

        <section class="stats-grid">
            <div class="card"><h3>Total Supply</h3><p id="supply">100,000,000</p></div>
            <div class="card"><h3>Market Cap</h3><p id="mcap">$420.69M</p></div>
            <div class="card"><h3>Active Nodes</h3><p id="nodes">4,204</p></div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
